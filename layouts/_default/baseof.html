<!DOCTYPE html>
<html lang="en" data-theme="hard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <style>
    /*
     * Everforest dark palette — canonical source:
     * https://github.com/sainnhe/everforest/blob/master/autoload/everforest.vim
     *
     * Accent/foreground colors are shared across all variants.
     * Background colors change per variant (hard/medium/soft).
     * To switch: change data-theme on <html>.
     */

    /* --- variant backgrounds --- */
    [data-theme="hard"] {
      --ef-bg-dim: #1e2326; --ef-bg0: #272e33; --ef-bg1: #2e383c;
      --ef-bg2: #374145;    --ef-bg3: #414b50; --ef-bg4: #495156;
      --ef-bg5: #4f5b58;
      --ef-bg-visual: #4c3743; --ef-bg-red: #493b40; --ef-bg-yellow: #45443c;
      --ef-bg-green: #3c4841;  --ef-bg-blue: #384b55; --ef-bg-purple: #463f48;
    }
    [data-theme="medium"] {
      --ef-bg-dim: #232a2e; --ef-bg0: #2d353b; --ef-bg1: #343f44;
      --ef-bg2: #3d484d;    --ef-bg3: #475258; --ef-bg4: #4f585e;
      --ef-bg5: #56635f;
      --ef-bg-visual: #543a48; --ef-bg-red: #514045; --ef-bg-yellow: #4d4c43;
      --ef-bg-green: #425047;  --ef-bg-blue: #3a515d; --ef-bg-purple: #4a444e;
    }
    [data-theme="soft"] {
      --ef-bg-dim: #293136; --ef-bg0: #333c43; --ef-bg1: #3a464c;
      --ef-bg2: #434f55;    --ef-bg3: #4d5960; --ef-bg4: #555f66;
      --ef-bg5: #5d6b66;
      --ef-bg-visual: #5c3f4f; --ef-bg-red: #59464c; --ef-bg-yellow: #55544a;
      --ef-bg-green: #48584e;  --ef-bg-blue: #3f5865; --ef-bg-purple: #4e4953;
    }

    /* --- shared accent/foreground --- */
    :root {
      --ef-fg:     #d3c6aa;
      --ef-red:    #e67e80; --ef-orange: #e69875; --ef-yellow: #dbbc7f;
      --ef-green:  #a7c080; --ef-aqua:   #83c092; --ef-blue:   #7fbbb3;
      --ef-purple: #d699b6;
      --ef-grey0:  #7a8478; --ef-grey1:  #859289; --ef-grey2:  #9da9a0;
    }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // ef = everforest — don't overwrite, append new themes as siblings
            ef: {
              'bg-dim': 'var(--ef-bg-dim)',
              bg:       'var(--ef-bg0)',
              bg1:      'var(--ef-bg1)',
              bg2:      'var(--ef-bg2)',
              bg3:      'var(--ef-bg3)',
              bg4:      'var(--ef-bg4)',
              bg5:      'var(--ef-bg5)',
              'bg-visual': 'var(--ef-bg-visual)',
              'bg-red':    'var(--ef-bg-red)',
              'bg-yellow': 'var(--ef-bg-yellow)',
              'bg-green':  'var(--ef-bg-green)',
              'bg-blue':   'var(--ef-bg-blue)',
              'bg-purple': 'var(--ef-bg-purple)',
              fg:      'var(--ef-fg)',
              grey0:   'var(--ef-grey0)',
              grey1:   'var(--ef-grey1)',
              grey2:   'var(--ef-grey2)',
              green:   'var(--ef-green)',
              aqua:    'var(--ef-aqua)',
              orange:  'var(--ef-orange)',
              red:     'var(--ef-red)',
              yellow:  'var(--ef-yellow)',
              purple:  'var(--ef-purple)',
              blue:    'var(--ef-blue)',
            }
          }
        }
      }
    }
  </script>
  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-ekhkHL3y6f7LqsK1t0kiO.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
</head>
<body class="max-w-3xl mx-auto px-4 py-8 bg-ef-bg text-ef-fg min-h-screen flex flex-col">
  <header class="flex flex-wrap items-center justify-between gap-2 mb-8">
    <a href="/" class="text-xl font-bold hover:text-ef-green">{{ .Site.Title }}</a>
    <form action="https://buttondown.com/api/emails/embed-subscribe/tompassarelli" method="post" class="flex gap-2 items-center">
      <input type="email" name="email" placeholder="your@email.com" required
        class="bg-ef-bg1 border border-ef-bg3 rounded px-3 py-1.5 text-sm text-ef-fg placeholder-ef-grey0 focus:outline-none focus:border-ef-green">
      <button type="submit" class="bg-ef-green hover:bg-ef-aqua text-ef-bg px-3 py-1.5 text-sm rounded font-medium">subscribe</button>
    </form>
    <a href="/index.xml" title="RSS Feed" class="text-ef-grey0 hover:text-ef-orange" aria-label="RSS Feed">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="6.18" cy="17.82" r="2.18"/><path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/></svg>
    </a>
  </header>
  <div class="flex-1">{{ block "main" . }}{{ end }}</div>
</body>
</html>
